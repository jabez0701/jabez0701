<svg xmlns="http://www.w3.org/2000/svg" width="820" height="376" viewBox="0 0 820 376" role="img" aria-label="Terminal: Jabez Jebaraj D, passionate about art and tech. Building Design OS, a design engine that turns a brief into a motion-rich site, model-agnostic. The AI only writes words; code builds the rest and checks it. ACTO at Aspire Code AI.">
  <style>
    .t { font-family: 'JetBrains Mono','Fira Code','SF Mono',Consolas,'Liberation Mono',monospace; font-size: 15px; fill: #c0caf5; }
    .p { fill: #9ece6a; }
    .c { fill: #7dcfff; }
    .d { fill: #565f89; }
    .a { fill: #bb9af7; }
    .l { clip-path: inset(0 100% 0 0); animation: type 1s steps(40, end) forwards; }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    .cur { fill: #c0caf5; animation: blink 1s steps(1) infinite; animation-delay: 11s; opacity: 0; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; clip-path: none; } .cur { animation: none; opacity: 1; } }
  </style>
  <rect width="820" height="376" rx="10" fill="#1a1b26"/>
  <path d="M0 10a10 10 0 0 1 10-10h800a10 10 0 0 1 10 10v26H0z" fill="#16161e"/>
  <circle cx="22" cy="18" r="6" fill="#f7768e"/>
  <circle cx="42" cy="18" r="6" fill="#e0af68"/>
  <circle cx="62" cy="18" r="6" fill="#9ece6a"/>
  <text x="410" y="23" text-anchor="middle" class="t d" style="font-size:13px">Jabez0701@~</text>

  <g class="t">
    <text class="l" x="24" y="68" style="animation-delay:0.3s"><tspan class="p">Jabez0701@</tspan><tspan class="c">~</tspan><tspan class="d">$ </tspan>whoami</text>
    <text class="l" x="24" y="92" style="animation-delay:1.3s"><tspan class="a">Jabez Jebaraj D</tspan> · passionate about ART and TECH</text>

    <text class="l" x="24" y="132" style="animation-delay:2.4s"><tspan class="p">Jabez0701@</tspan><tspan class="c">~</tspan><tspan class="d">$ </tspan>cat building.txt</text>
    <text class="l" x="24" y="156" style="animation-delay:3.4s"><tspan class="d">→ </tspan>Design OS: a design engine, brief in, motion-rich site out</text>
    <text class="l" x="24" y="180" style="animation-delay:4.6s"><tspan class="d">→ </tspan>model-agnostic: runs on local models or cloud ones</text>
    <text class="l" x="24" y="204" style="animation-delay:5.8s"><tspan class="d">→ </tspan>the AI only writes words. code builds the rest, then checks it.</text>

    <text class="l" x="24" y="244" style="animation-delay:7s"><tspan class="p">Jabez0701@</tspan><tspan class="c">~</tspan><tspan class="d">$ </tspan>echo $ROLE</text>
    <text class="l" x="24" y="268" style="animation-delay:8s">ACTO @ <tspan class="a">Aspire Code AI</tspan></text>

    <text class="l" x="24" y="308" style="animation-delay:9s"><tspan class="p">Jabez0701@</tspan><tspan class="c">~</tspan><tspan class="d">$ </tspan>echo $TAGLINE</text>
    <text class="l" x="24" y="332" style="animation-delay:10s">ART and TECH never bores anyone</text>

    <text x="24" y="360"><tspan class="p">Jabez0701@</tspan><tspan class="c">~</tspan><tspan class="d">$ </tspan></text>
    <rect class="cur" x="141" y="347" width="9" height="17"/>
  </g>
</svg>
